<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Tarik Tambang Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="game">
    <header class="topbar">
      <div class="brand">❓ PETUNJUK</div>
      <h1>GAME <span>TARIK TAMBANG</span><small>QUIZ</small></h1>
      <div class="score">🏆 Skor <b id="blueScore">0</b> : <b id="redScore">0</b></div>
    </header>

    <section class="setup">
      <input id="sheetUrl" type="url" placeholder="Masukkan link Google Sheet">
      <button id="loadSheet">▣ MUAT SOAL</button>
      <small>Kolom: Pertanyaan | Opsi A | Opsi B | Opsi C | Opsi D | Jawaban</small>
    </section>

    <section class="arena" aria-label="Arena tarik tambang">
      <div class="team blue-team" id="blueTeam">
        <div class="kid kid1">
          <div class="head">
            <div class="hair"></div><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i>
          </div>
          <div class="body blue-shirt"></div>
          <div class="arm arm-back"><i class="hand"></i></div>
          <div class="arm arm-rope"><i class="hand"></i></div>
          <div class="leg leg-back"></div>
          <div class="leg leg-front"></div>
          <div class="shoe shoe-back"></div>
          <div class="shoe shoe-front"></div>
        </div>
        <div class="kid kid2">
          <div class="head">
            <div class="hair"></div><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i>
          </div>
          <div class="body blue-shirt"></div>
          <div class="arm arm-back"><i class="hand"></i></div>
          <div class="arm arm-rope"><i class="hand"></i></div>
          <div class="leg leg-back"></div>
          <div class="leg leg-front"></div>
          <div class="shoe shoe-back"></div>
          <div class="shoe shoe-front"></div>
        </div>
        <div class="kid kid3">
          <div class="head">
            <div class="hair"></div><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i>
          </div>
          <div class="body blue-shirt"></div>
          <div class="arm arm-back"><i class="hand"></i></div>
          <div class="arm arm-rope"><i class="hand"></i></div>
          <div class="leg leg-back"></div>
          <div class="leg leg-front"></div>
          <div class="shoe shoe-back"></div>
          <div class="shoe shoe-front"></div>
        </div>
      </div>

      <div class="rope-wrap">
        <div class="rope"></div>
        <div class="center-marker"></div>
      </div>

      <div class="team red-team" id="redTeam">
        <div class="kid kid1">
          <div class="head">
            <div class="hair"></div><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i>
          </div>
          <div class="body red-shirt"></div>
          <div class="arm arm-back"><i class="hand"></i></div>
          <div class="arm arm-rope"><i class="hand"></i></div>
          <div class="leg leg-back"></div>
          <div class="leg leg-front"></div>
          <div class="shoe shoe-back"></div>
          <div class="shoe shoe-front"></div>
        </div>
        <div class="kid kid2">
          <div class="head">
            <div class="hair"></div><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i>
          </div>
          <div class="body red-shirt"></div>
          <div class="arm arm-back"><i class="hand"></i></div>
          <div class="arm arm-rope"><i class="hand"></i></div>
          <div class="leg leg-back"></div>
          <div class="leg leg-front"></div>
          <div class="shoe shoe-back"></div>
          <div class="shoe shoe-front"></div>
        </div>
        <div class="kid kid3">
          <div class="head">
            <div class="hair"></div><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i>
          </div>
          <div class="body red-shirt"></div>
          <div class="arm arm-back"><i class="hand"></i></div>
          <div class="arm arm-rope"><i class="hand"></i></div>
          <div class="leg leg-back"></div>
          <div class="leg leg-front"></div>
          <div class="shoe shoe-back"></div>
          <div class="shoe shoe-front"></div>
        </div>
      </div>
    </section>

    <section class="quiz-grid">
      <article class="quiz blue-quiz">
        <h2>TIM BIRU</h2>
        <div class="question" id="blueQuestion">Memuat soal...</div>
        <div class="answers" id="blueAnswers"></div>
      </article>

      <article class="quiz red-quiz">
        <h2>TIM MERAH</h2>
        <div class="question" id="redQuestion">Memuat soal...</div>
        <div class="answers" id="redAnswers"></div>
      </article>
    </section>

    <div class="message" id="message"></div>
    <button class="reset" id="reset">↻ Reset Skor</button>
  </main>

  <script src="script.js"></script>
</body>

</html>
