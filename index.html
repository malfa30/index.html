<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Tarik Tambang</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#222;
}
.game{
  width:100%;
  max-width:1200px;
  margin:auto;
  min-height:100vh;
  padding:24px 22px 30px;
}
.top{
  text-align:center;
  padding-top:5px;
}
.tug{
  height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.rope{
  position:absolute;
  width:230px;
  height:7px;
  background:#9a5a2b;
  border-radius:8px;
}
.knot{
  position:absolute;
  width:22px;
  height:28px;
  background:#ffd51a;
  border:3px solid #b99000;
  border-radius:4px;
  z-index:3;
}
.person{
  position:absolute;
  width:70px;
  height:90px;
  bottom:35px;
}
.person .head{
  position:absolute;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#f2b58c;
  border:2px solid #333;
  top:0;
}
.person .hair{
  position:absolute;
  width:40px;
  height:12px;
  background:#252525;
  border-radius:8px 8px 2px 2px;
  top:-2px;
  z-index:2;
}
.person .body{
  position:absolute;
  width:43px;
  height:38px;
  background:#1769e8;
  border:2px solid #333;
  border-radius:8px 8px 3px 3px;
  top:40px;
  left:8px;
}
.person .leg{
  position:absolute;
  width:12px;
  height:28px;
  background:#333;
  top:72px;
  border-radius:4px;
}
.person .leg.l{left:13px}.person .leg.r{left:34px}
.person.left{margin-right:205px;transform:scaleX(-1)}
.person.right{margin-left:205px}
.person.right .body{background:#d9272e}
.person.left .head{left:10px}.person.right .head{left:10px}
.instruction{
  margin-top:-8px;
  font-weight:bold;
  font-size:16px;
}
.teams{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:14px;
}
.team{
  border:1px solid #ddd;
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 2px 5px #0001;
}
.teamTitle{
  color:white;
  padding:18px 15px;
  font-weight:bold;
  font-size:16px;
  min-height:58px;
}
.blueTitle{background:#073c99}
.redTitle{background:#c4000b}
.answers{
  padding:9px;
  background:#fafafa;
}
.answer{
  display:block;
  width:100%;
  min-height:45px;
  text-align:left;
  padding:12px 14px;
  margin:0 0 4px;
  background:#fff;
  border:1px solid #ddd;
  font-size:14px;
  cursor:pointer;
  transition:.15s;
}
.answer:hover{background:#f0f0f0}
.answer:active{transform:scale(.99)}
.answer.correct{
  background:#43a047!important;
  color:white;
  border-color:#2e7d32;
}
.answer.wrong{
  background:#e53935!important;
  color:white;
  border-color:#c62828;
}
.question{
  padding:13px 15px;
  min-height:65px;
  font-weight:bold;
  line-height:1.35;
  font-size:15px;
}
.blueQ{background:#073c99;color:#fff}
.redQ{background:#c4000b;color:#fff}
.status{
  text-align:center;
  font-weight:bold;
  margin:18px 0 0;
  min-height:22px;
}
#start{
  display:block;
  margin:14px auto 0;
  border:0;
  background:#222;
  color:#fff;
  padding:12px 28px;
  border-radius:8px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}
#loading{
  text-align:center;
  font-weight:bold;
  margin:8px 0 12px;
}
#error{
  text-align:center;
  color:#c62828;
  font-weight:bold;
  max-width:700px;
  margin:10px auto;
}
.setup{
  text-align:center;
  padding:10px;
}
.title{
  text-align:center;
  margin-top:26px;
  font-size:43px;
  font-weight:900;
  letter-spacing:1px;
}
.title .yellow{color:#f4c400;text-shadow:2px 2px #222}
.title .white{color:#fff;text-shadow:2px 2px 0 #222, -1px -1px 0 #222,1px -1px 0 #222,-1px 1px 0 #222}
.subtitle{
  display:table;
  margin:8px auto 0;
  background:#222;
  color:#fff;
  padding:8px 16px;
  font-size:18px;
  font-weight:bold;
}
#result{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:20;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#fff;
  text-align:center;
}
#result h2{font-size:38px}
#result button{padding:14px 25px;border:0;border-radius:8px;font-weight:bold}
@media(max-width:700px){
  .game{padding:12px 10px}
  .tug{height:130px}
  .person{transform:scale(.78)!important}
  .person.left{margin-right:150px}
  .person.right{margin-left:150px}
  .rope{width:180px}
  .teams{grid-template-columns:1fr;gap:12px}
  .title{font-size:30px}
  .subtitle{font-size:14px}
}
</style>
</head>
<body>

<div class="game">

<div id="loading">⏳ Memuat soal dari Google Sheets...</div>
<div id="error"></div>

<div id="gameArea" style="display:none">

<div class="top">
  <div class="tug">
    <div class="rope"></div>
    <div class="knot" id="knot"></div>

    <div class="person left">
      <div class="head"></div><div class="hair"></div>
      <div class="body"></div>
      <div class="leg l"></div><div class="leg r"></div>
    </div>

    <div class="person right">
      <div class="head"></div><div class="hair"></div>
      <div class="body"></div>
      <div class="leg l"></div><div class="leg r"></div>
    </div>
  </div>

  <div class="instruction">Jawab soal untuk menarik tali!</div>
</div>

<div class="teams">

  <div class="team">
    <div class="teamTitle blueTitle">TIM BIRU</div>
    <div class="question blueQ" id="questionBlue"></div>
    <div class="answers" id="answersBlue"></div>
  </div>

  <div class="team">
    <div class="teamTitle redTitle">TIM MERAH</div>
    <div class="question redQ" id="questionRed"></div>
    <div class="answers" id="answersRed"></div>
  </div>

</div>

<div class="status" id="status"></div>
<button id="start" onclick="startGame()">▶ MULAI</button>

<div class="title">
  <span class="yellow">GAME</span>
  <span class="white"> TARIK TAMBANG</span>
</div>
<div class="subtitle">Cara mudah membuat game interaktif tarik tambang</div>

</div>
</div>

<div id="result">
  <h2 id="winner"></h2>
  <p>Permainan selesai!</p>
  <button onclick="location.reload()">🔄 MAIN LAGI</button>
</div>

<script>
const SHEET_ID="1bjO7_rm4hc14hFFyk_-CY3BXTWKsoklt93DdNsaPP3s";
const SHEET_GID="0";

let questions=[];
let current=0;
let ropePosition=0;
let playing=false;
const WIN=6;

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function cell(row,i){
  return row.c[i] && row.c[i].v!=null ? String(row.c[i].v).trim() : "";
}

async function loadQuestions(){
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;
    const r=await fetch(url);
    if(!r.ok) throw Error("Google Sheets tidak dapat diakses.");
    const text=await r.text();
    const data=JSON.parse(text.slice(text.indexOf("{"),text.lastIndexOf("}")+1));

    (data.table.rows||[]).forEach(row=>{
      const q=cell(row,0);
      const benar=cell(row,1);
      const salah1=cell(row,2);
      const salah2=cell(row,3);
      const salah3=cell(row,4);

      if(q&&benar&&salah1&&salah2&&salah3){
        questions.push({
          q:q,
          answers:shuffle([
            {text:benar,correct:true},
            {text:salah1,correct:false},
            {text:salah2,correct:false},
            {text:salah3,correct:false}
          ])
        });
      }
    });

    if(!questions.length) throw Error("Tidak ada soal valid di kolom A-E.");

    document.getElementById("loading").style.display="none";
    document.getElementById("gameArea").style.display="block";
    document.getElementById("status").textContent=`${questions.length} soal siap.`;
    setTimeout(startGame,400);
  }catch(e){
    document.getElementById("loading").textContent="❌ Gagal memuat soal";
    document.getElementById("error").textContent=e.message+" Pastikan Google Sheets dapat dilihat oleh siapa saja yang memiliki link.";
  }
}

function startGame(){
  if(!questions.length)return;
  current=0;
  ropePosition=0;
  playing=true;
  document.getElementById("start").style.display="none";
  showQuestion();
  moveRope();
}

function showQuestion(){
  const q=questions[current%questions.length];
  document.getElementById("questionBlue").textContent=q.q;
  document.getElementById("questionRed").textContent=q.q;

  makeAnswers("answersBlue",q);
  makeAnswers("answersRed",q);
}

function makeAnswers(id,q){
  const box=document.getElementById(id);
  box.innerHTML="";
  q.answers.forEach((a,i)=>{
    const b=document.createElement("button");
    b.className="answer";
    b.textContent=a.text;
    b.onclick=()=>answer(a,b,box);
    box.appendChild(b);
  });
}

function answer(a,button,box){
  if(!playing)return;

  const all=box.querySelectorAll(".answer");
  all.forEach(x=>x.disabled=true);

  if(a.correct){
    button.classList.add("correct");
    ropePosition--;
    document.getElementById("status").textContent="✅ Benar! Tali tertarik ke Tim Biru.";
  }else{
    button.classList.add("wrong");
    ropePosition++;
    document.getElementById("status").textContent="❌ Salah! Tali tertarik ke Tim Merah.";
    [...all].forEach((x,i)=>{
      if(questions[current%questions.length].answers[i].correct)
        x.classList.add("correct");
    });
  }

  moveRope();

  if(ropePosition<=-WIN){
    return setTimeout(()=>finish("🔵 TIM BIRU MENANG!"),700);
  }
  if(ropePosition>=WIN){
    return setTimeout(()=>finish("🔴 TIM MERAH MENANG!"),700);
  }

  current++;
  setTimeout(showQuestion,850);
}

function moveRope(){
  const px=ropePosition*24;
  document.getElementById("knot").style.transform=`translateX(${px}px)`;
}

function finish(text){
  playing=false;
  document.getElementById("winner").textContent=text;
  document.getElementById("result").style.display="flex";
}

loadQuestions();
</script>
</body>
</html>
