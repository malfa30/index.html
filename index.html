<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarik Tambang</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(#87ceeb,#eefaff);min-height:100vh}.game{max-width:650px;margin:auto;padding:16px}h1{text-align:center}.panel,.questionBox{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0002}input{width:100%;padding:14px;border:2px solid #ccc;border-radius:12px;font-size:15px}button{border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:bold;cursor:pointer}.connect,.start{width:100%;margin-top:10px;background:#222;color:#fff}.hint{font-size:13px;color:#666;line-height:1.5}.score{display:flex;justify-content:space-between;font-weight:bold;margin:10px 0}.blueText{color:#1769ff}.redText{color:#e53935}.arena{position:relative;height:240px;background:#80c95a;border:4px solid #333;border-radius:20px;overflow:hidden}.ground{position:absolute;bottom:0;width:100%;height:48px;background:#795548}.character{position:absolute;bottom:40px;font-size:65px;transition:.4s}.blue{left:8px}.red{right:8px;transform:scaleX(-1)}.rope{position:absolute;top:130px;left:10%;width:80%;height:10px;background:#c49a6c;border:2px solid #704214;border-radius:10px;transition:.4s}.flag{position:absolute;top:88px;left:50%;transform:translateX(-50%);font-size:38px;transition:.4s}#gameArea{display:none}.questionBox{margin-top:15px}#question{text-align:center;font-size:21px;font-weight:bold;min-height:55px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{background:#eee;width:100%}.correct{background:#4caf50!important;color:white}.wrong{background:#f44336!important;color:white}#message{text-align:center;font-weight:bold;min-height:24px;margin:10px 0}#error{color:#c62828;font-weight:bold;margin-top:10px}#result{display:none;position:fixed;inset:0;background:#000c;z-index:5;align-items:center;justify-content:center;flex-direction:column;color:white;text-align:center}#result h2{font-size:36px}</style></head>
<body><div class="game"><h1>🪢 TARIK TAMBANG 🪢</h1>
<div id="setup" class="panel"><b>🔗 Link Google Sheets Soal</b><br><br><input id="sheetUrl" type="url" placeholder="Tempel link Google Sheets di sini"><button class="connect" onclick="connectSheet()">📥 Hubungkan Soal</button><p class="hint">Setel Google Sheets: <b>Siapa saja yang memiliki link → Pelihat</b>.<br>Kolom: <b>Soal | A | B | C | D | Benar</b></p><div id="error"></div></div>
<div id="gameArea"><div class="score"><span class="blueText">🔵 TIM BIRU</span><span class="redText">TIM MERAH 🔴</span></div><div class="arena"><div class="character blue">🏃</div><div class="character red">🏃</div><div class="rope" id="rope"></div><div class="flag" id="flag">🚩</div><div class="ground"></div></div><p id="status"></p><div class="questionBox"><div id="question">Soal siap.</div><div class="answers" id="answers"></div><div id="message"></div><button class="start" id="startButton" onclick="startGame()">▶️ MULAI</button></div></div></div>
<div id="result"><h2 id="winner"></h2><p>Permainan selesai!</p><button onclick="location.reload()">🔄 MAIN LAGI</button></div>
<script>
let questions=[],currentQuestion=0,ropePosition=0,gameStarted=false;const winPosition=6;
function $(id){return document.getElementById(id)}
function extract(url){let m=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);if(!m)throw Error("Link Google Sheets tidak valid.");let g=(url.match(/[?#&]gid=([0-9]+)/)||[])[1]||"0";return{id:m[1],gid:g}}
async function connectSheet(){let err=$("error"),btn=document.querySelector(".connect");err.textContent="";try{let u=extract($("sheetUrl").value.trim());btn.disabled=true;btn.textContent="⏳ Memuat...";let r=await fetch(`https://docs.google.com/spreadsheets/d/${u.id}/gviz/tq?tqx=out:json&gid=${u.gid}`);if(!r.ok)throw Error("Google Sheets tidak dapat diakses.");let t=await r.text(),j=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));questions=[];(j.table.rows||[]).forEach(row=>{let c=row.c||[],v=i=>c[i]&&c[i].v!=null?String(c[i].v).trim():"";let q=v(0),a=v(1),b=v(2),cc=v(3),d=v(4),ok=v(5).toUpperCase();if(q&&a&&b&&cc&&d&&["A","B","C","D"].includes(ok))questions.push({question:q,answers:[a,b,cc,d],correct:ok})});if(!questions.length)throw Error("Tidak ada soal valid. Cek format Sheet.");$("setup").style.display="none";$("gameArea").style.display="block";$("status").textContent=`✅ ${questions.length} soal berhasil dimuat.`}catch(e){err.textContent="❌ "+e.message}finally{btn.disabled=false;btn.textContent="📥 Hubungkan Soal"}}
function startGame(){gameStarted=true;currentQuestion=0;ropePosition=0;$("startButton").style.display="none";updateRope();showQuestion()}
function showQuestion(){let q=questions[currentQuestion%questions.length];$("question").textContent=q.question;$("answers").innerHTML="";$("message").textContent="";q.answers.forEach((a,i)=>{let b=document.createElement("button");b.className="answer";b.textContent=String.fromCharCode(65+i)+". "+a;b.onclick=()=>checkAnswer(i,b);$("answers").appendChild(b)})}
function checkAnswer(i,b){if(!gameStarted)return;let q=questions[currentQuestion%questions.length],ci=["A","B","C","D"].indexOf(q.correct),bs=document.querySelectorAll(".answer");bs.forEach(x=>x.disabled=true);if(i===ci){b.classList.add("correct");ropePosition--;$("message").textContent="✅ BENAR! Tim Biru menarik!"}else{b.classList.add("wrong");bs[ci].classList.add("correct");ropePosition++;$("message").textContent="❌ SALAH! Tim Merah menarik!"}updateRope();if(ropePosition<=-winPosition)return setTimeout(()=>finish("🔵 TIM BIRU MENANG!"),700);if(ropePosition>=winPosition)return setTimeout(()=>finish("🔴 TIM MERAH MENANG!"),700);currentQuestion++;setTimeout(showQuestion,900)}
function updateRope(){let m=ropePosition*25;$("rope").style.transform=`translateX(${m}px)`;$("flag").style.left=`calc(50% + ${m}px)`}
function finish(t){gameStarted=false;$("winner").textContent=t;$("result").style.display="flex"}
</script></body></html>
