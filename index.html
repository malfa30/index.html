<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Game Tarik Tambang Quiz</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #72c8ef;
            color: #10233b
        }

        button,
        input {
            font: inherit
        }

        .hide {
            display: none !important
        }

        body:before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(#55b9ef 0 48%, #82c95d 48% 100%)
        }

        body:after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: .12;
            background-image: radial-gradient(#fff 1px, transparent 1px);
            background-size: 18px 18px
        }

        .wrap {
            max-width: 1450px;
            margin: auto;
            padding: 18px
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px
        }

        .help,
        .score {
            background: #073766;
            color: #fff;
            padding: 12px 22px;
            border-radius: 16px;
            font-weight: 900;
            box-shadow: 0 5px 0 #05284a
        }

        .help {
            cursor: pointer
        }

        .score {
            font-size: 20px
        }

        .title {
            text-align: center;
            font-weight: 1000;
            line-height: .85;
            font-size: clamp(35px, 5vw, 70px);
            text-shadow: 4px 5px #08335b;
            margin: 5px 0 0;
            color: #fff
        }

        .title span {
            display: block;
            color: #ffd21b;
            -webkit-text-stroke: 2px #172c3d
        }

        .ribbon {
            display: inline-block;
            background: #df2d1f;
            color: #fff;
            font-size: clamp(20px, 3vw, 38px);
            padding: 8px 70px;
            border-radius: 10px;
            margin-top: 5px;
            box-shadow: 0 6px #7b160f
        }

        .setup {
            position: absolute;
            left: 20px;
            top: 82px;
            background: #fff;
            border: 3px solid #174b78;
            border-radius: 18px;
            padding: 15px;
            width: min(500px, calc(100% - 40px));
            box-shadow: 0 8px 18px #0003;
            z-index: 10
        }

        .setup h2 {
            margin: 0 0 8px;
            text-align: center
        }

        .setup input {
            width: 100%;
            padding: 13px;
            border: 2px solid #aaa;
            border-radius: 10px
        }

        .start {
            width: 100%;
            margin-top: 9px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #24a33a;
            color: #fff;
            font-weight: 900;
            cursor: pointer
        }

        .err {
            color: #c21d1d;
            font-weight: bold;
            margin-top: 8px
        }

        .tip {
            font-size: 12px;
            color: #555;
            margin-top: 8px
        }

        .arena {
            height: 400px;
            position: relative;
            margin-top: 12px;
            overflow: hidden
        }

        .cloud {
            position: absolute;
            background: #fff;
            width: 120px;
            height: 35px;
            border-radius: 40px;
            opacity: .8
        }

        .cloud:before,
        .cloud:after {
            content: "";
            position: absolute;
            background: #fff;
            border-radius: 50%
        }

        .cloud:before {
            width: 55px;
            height: 55px;
            left: 15px;
            top: -25px
        }

        .cloud:after {
            width: 65px;
            height: 65px;
            right: 12px;
            top: -32px
        }

        .c1 {
            left: 8%;
            top: 40px
        }

        .c2 {
            right: 8%;
            top: 80px
        }

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 105px;
            background: linear-gradient(#7acb52, #4a9f3e);
            border-radius: 45% 45% 0 0/20% 20% 0 0
        }

        .tug {
            position: absolute;
            left: 4%;
            right: 4%;
            top: 115px;
            height: 250px
        }

        .team {
            position: absolute;
            top: 0;
            width: 46%;
            height: 250px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end
        }

        .blueTeam {
            left: 0
        }

        .redTeam {
            right: 0;
            flex-direction: row-reverse
        }

        .person {
            width: 31%;
            min-width: 125px;
            position: relative;
            transition: transform .55s cubic-bezier(.2, .8, .2, 1);
            filter: drop-shadow(0 5px 2px #0003)
        }

        .person svg {
            width: 100%;
            height: auto;
            display: block
        }

        .person .shirtB {
            fill: #176ce0
        }

        .person .shirtR {
            fill: #e3342f
        }

        .skin {
            fill: #f3b18b
        }

        .hair {
            fill: #151515
        }

        .pants {
            fill: #222
        }

        .shoe {
            fill: #17202b;
            stroke: #111;
            stroke-width: 3
        }

        .edge {
            stroke: #18202a;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .happy .mouth {
            d: path("M0 2 Q10 13 20 2")
        }

        .angry .mouth {
            d: path("M0 10 Q10 0 20 10")
        }

        .happy .b1 {
            transform: rotate(-10deg)
        }

        .happy .b2 {
            transform: rotate(10deg)
        }

        .angry .b1 {
            transform: rotate(25deg)
        }

        .angry .b2 {
            transform: rotate(-25deg)
        }

        .rope {
            position: absolute;
            left: 9%;
            right: 9%;
            top: 135px;
            height: 85px;
            z-index: 5;
            pointer-events: none
        }

        .rope svg {
            width: 100%;
            height: 100%;
            overflow: visible
        }

        .ropeMain {
            fill: none;
            stroke: #76471e;
            stroke-width: 12;
            stroke-linecap: round
        }

        .ropeLight {
            fill: none;
            stroke: #b97b43;
            stroke-width: 3;
            stroke-dasharray: 10 8
        }

        .flag {
            position: absolute;
            left: 50%;
            top: 118px;
            width: 28px;
            height: 52px;
            background: #ffd21a;
            border: 3px solid #9d7800;
            border-radius: 4px;
            z-index: 8;
            transform: translateX(-50%);
            transition: transform .55s
        }

        .flag:after {
            content: "";
            position: absolute;
            left: 10px;
            top: 47px;
            height: 45px;
            border-left: 4px solid #6e4a22
        }

        .dust {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d9c89d;
            opacity: 0;
            z-index: 3
        }

        .dust.show {
            animation: dust .65s ease-out
        }

        @keyframes dust {
            0% {
                opacity: .8;
                transform: translate(0, 0) scale(.5)
            }

            100% {
                opacity: 0;
                transform: translate(0, -35px) scale(2)
            }
        }

        .pullB {
            animation: pullB .6s
        }

        .pullR {
            animation: pullR .6s
        }

        .lose {
            animation: lose .6s
        }

        .hands {
            animation: hands .3s 2 alternate
        }

        .ropeTug {
            animation: ropeTug .6s
        }

        @keyframes pullB {
            35% {
                transform: translate(-18px, 8px) rotate(-3deg)
            }

            65% {
                transform: translate(5px, -2px)
            }
        }

        @keyframes pullR {
            35% {
                transform: translate(18px, 8px) rotate(3deg)
            }

            65% {
                transform: translate(-5px, -2px)
            }
        }

        @keyframes lose {
            35% {
                transform: translate(0, 7px) rotate(2deg)
            }

            65% {
                transform: translate(0, -2px)
            }
        }

        @keyframes hands {
            to {
                transform: translate(8px, 3px)
            }
        }

        @keyframes ropeTug {
            35% {
                transform: scaleY(1.08)
            }

            65% {
                transform: scaleY(.96)
            }
        }

        .questions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px
        }

        .panel {
            background: #fff;
            border-radius: 18px;
            padding: 0 14px 14px;
            box-shadow: 0 8px 18px #0003;
            overflow: hidden
        }

        .panel h2 {
            margin: 0 -14px 12px;
            padding: 15px;
            text-align: center;
            color: #fff;
            font-size: 25px
        }

        .blueH {
            background: #0864dc
        }

        .redH {
            background: #d92323
        }

        .q {
            text-align: center;
            font-weight: 900;
            font-size: 19px;
            min-height: 55px;
            padding: 5px
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px
        }

        .ans {
            border: 2px solid #d6d6d6;
            background: #fff;
            border-radius: 10px;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            min-height: 52px;
            font-weight: 700
        }

        .ans:hover {
            background: #eef5ff
        }

        .correct {
            background: #36a852 !important;
            color: white;
            border-color: #22813a
        }

        .wrong {
            background: #e43b3b !important;
            color: #fff;
            border-color: #a31c1c
        }

        .status {
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            padding: 14px
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            gap: 10px
        }

        .bottom button {
            border: 0;
            border-radius: 12px;
            background: #073766;
            color: #fff;
            padding: 11px 18px;
            font-weight: 900
        }

        @media(max-width:800px) {
            .setup {
                position: relative;
                left: auto;
                top: auto;
                margin: 8px auto
            }

            .top {
                align-items: center
            }

            .score {
                font-size: 15px;
                padding: 10px
            }

            .help {
                padding: 10px
            }

            .arena {
                height: 285px
            }

            .tug {
                top: 85px
            }

            .rope {
                top: 102px
            }

            .flag {
                top: 87px
            }

            .team {
                height: 190px
            }

            .person {
                min-width: 85px
            }

            .questions {
                grid-template-columns: 1fr
            }

            .answers {
                grid-template-columns: 1fr 1fr
            }

            .title {
                font-size: 38px
            }

            .ribbon {
                padding: 6px 35px;
                font-size: 22px
            }
        }

        @media(max-width:480px) {
            .arena {
                height: 245px
            }

            .team {
                height: 155px
            }

            .tug {
                top: 70px
            }

            .rope {
                top: 80px
            }

            .flag {
                top: 65px
            }

            .person {
                min-width: 68px
            }

            .questions {
                gap: 12px
            }

            .answers {
                grid-template-columns: 1fr
            }

            .panel h2 {
                font-size: 20px
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="top"><button class="help"
                onclick="alert('Masukkan link Google Sheets. Kolom A=Pertanyaan, B=Jawaban Benar, C-E=Jawaban Salah. Setel akses Sheet menjadi Siapa saja yang memiliki link → Pelihat.')">❔
                PETUNJUK</button>
            <div class="score">🏆 Skor <span id="score">0 : 0</span></div>
        </div>
        <div class="title">GAME <span>TARIK TAMBANG</span>
            <div class="ribbon">QUIZ</div>
        </div>

        <div id="setup" class="setup">
            <h2>Masukkan Link Google Sheet</h2>
            <input id="url" placeholder="https://docs.google.com/spreadsheets/d/...">
            <button class="start" onclick="connect()">▣ MULAI GAME</button>
            <div id="err" class="err"></div>
            <div class="tip">A = Pertanyaan • B = Jawaban Benar • C = Salah 1 • D = Salah 2 • E = Salah 3<br>Pastikan
                akses Google Sheet: <b>Siapa saja yang memiliki link → Pelihat</b>.</div>
        </div>

        <div id="game" class="hide">
            <div class="arena">
                <div class="cloud c1"></div>
                <div class="cloud c2"></div>
                <div class="ground"></div>
                <div class="tug">
                    <div class="team blueTeam" id="blueTeam"></div>
                    <div class="team redTeam" id="redTeam"></div>
                </div>
                <div class="rope" id="ropeBox"><svg viewBox="0 0 1000 100" preserveAspectRatio="none">
                        <path id="ropeShadow" class="ropeMain" d="M0 50 C250 50 750 50 1000 50" />
                        <path id="rope" class="ropeMain" d="M0 50 C250 50 750 50 1000 50" />
                        <path id="ropeLight" class="ropeLight" d="M0 47 C250 47 750 47 1000 47" />
                    </svg></div>
                <div id="flag" class="flag"></div>
                <div class="dust" style="left:15%;bottom:55px"></div>
                <div class="dust" style="left:24%;bottom:60px"></div>
                <div class="dust" style="right:15%;bottom:55px"></div>
                <div class="dust" style="right:24%;bottom:60px"></div>
            </div>

            <div class="questions">
                <div class="panel">
                    <h2 class="blueH">TIM BIRU</h2>
                    <div id="qB" class="q"></div>
                    <div id="aB" class="answers"></div>
                </div>
                <div class="panel">
                    <h2 class="redH">TIM MERAH</h2>
                    <div id="qR" class="q"></div>
                    <div id="aR" class="answers"></div>
                </div>
            </div>
            <div id="status" class="status">Jawab soal untuk menarik tali!</div>
            <div class="bottom"><button onclick="location.reload()">🔄 Reset</button><button onclick="toggleSound()">🔊
                    Suara: <span id="snd">ON</span></button></div>
        </div>
    </div>

    <script>
        let data = [], n = 0, position = 0, blueScore = 0, redScore = 0, locked = false, sound = true;
        const shuffle = a => {a = [...a]; for (let i = a.length - 1; i; i--) {let j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]} return a};
        function getId(u) {let m = u.match(/\/spreadsheets\/d\/([A-Za-z0-9_-]+)/); if (!m) throw Error("Link Google Sheets tidak valid."); let g = (u.match(/[?#&]gid=(\d+)/) || [])[1] || "0"; return [m[1], g]}
        async function connect() {
            try {
                let [id, gid] = getId(document.getElementById('url').value.trim());
                let r = await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&gid=${gid}`);
                if (!r.ok) throw Error("Google Sheet tidak bisa diakses.");
                let t = await r.text(), j = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1)); data = [];
                (j.table.rows || []).forEach(x => {let v = x.c || []; let a = i => v[i]?.v == null ? "" : String(v[i].v).trim(); if (a(0) && a(1) && a(2) && a(3) && a(4)) data.push({q: a(0), ans: shuffle([{t: a(1), ok: true}, {t: a(2)}, {t: a(3)}, {t: a(4)}])})});
                if (!data.length) throw Error("Tidak ada soal pada kolom A-E.");
                document.getElementById('setup').classList.add('hide'); document.getElementById('game').classList.remove('hide'); makePeople(); show();
            } catch (e) {document.getElementById('err').textContent = "❌ " + e.message + " Cek akses Sheet."}
        }
        function person(color, i) {
            return `<div class="person" id="${color}${i}"><svg viewBox="0 0 180 220">
<ellipse class="shoe" cx="62" cy="204" rx="27" ry="9"/><ellipse class="shoe" cx="119" cy="202" rx="27" ry="9"/>
<path class="skin edge" d="M50 145 L61 196 L77 196 L75 143Z"/><path class="skin edge" d="M103 143 L116 194 L133 194 L126 140Z"/>
<path class="${color === 'blue' ? 'shirtB' : 'shirtR'} edge" d="M46 83 Q88 62 130 86 L137 145 Q90 164 42 143Z"/>
<path class="skin edge" d="M55 92 Q30 106 21 126 L31 134 Q49 120 66 114Z"/>
<circle class="skin edge" cx="28" cy="129" r="9"/>
<path class="skin edge" d="M120 94 Q148 106 159 126 L149 134 Q130 119 113 114Z"/>
<circle class="skin edge" cx="158" cy="130" r="9"/>
<circle class="skin edge" cx="88" cy="54" r="35"/>
<path class="hair edge" d="M53 55 Q49 17 85 15 Q122 12 124 50 Q109 32 90 34 Q68 37 53 55Z"/>
<g class="face"><path class="b1 edge" d="M69 51 L79 49"/><path class="b2 edge" d="M98 49 L108 51"/><circle cx="75" cy="60" r="3.5"/><circle cx="102" cy="60" r="3.5"/><path class="mouth edge" d="M79 76 Q88 83 98 76"/></g>
</svg></div>`}
        function makePeople() {document.getElementById('blueTeam').innerHTML = [0, 1, 2].map(i => person('blue', i)).join(''); document.getElementById('redTeam').innerHTML = [0, 1, 2].map(i => person('red', i)).join('')}
        function face(side, win) {for (let c of ['blue', 'red']) for (let i = 0; i < 3; i++) {let x = document.getElementById(c + i); x.classList.remove('happy', 'angry'); if (c === side) x.classList.add(win ? 'happy' : 'angry')} }
        function show() {locked = false; let q = data[n % data.length]; document.getElementById('qB').textContent = q.q; document.getElementById('qR').textContent = q.q; makeAns('aB', q); makeAns('aR', q); document.getElementById('status').textContent = `Soal ${n + 1} • Pilih jawaban`; move()}
        function makeAns(id, q) {let b = document.getElementById(id); b.innerHTML = ''; q.ans.forEach(a => {let x = document.createElement('button'); x.className = 'ans'; x.textContent = a.t; x.onclick = () => answer(a, x, b); b.appendChild(x)})}
        function answer(a, btn, box) {if (locked) return; locked = true; box.querySelectorAll('button').forEach(x => x.disabled = true); let p = 1 + Math.floor(Math.random() * 3), side = a.ok ? 'blue' : 'red'; if (a.ok) {blueScore++; btn.classList.add('correct')} else {redScore++; btn.classList.add('wrong')} position += (side === 'blue' ? -p : p); face(side, true); for (let c of ['blue', 'red']) {for (let i = 0; i < 3; i++) {let x = document.getElementById(c + i); x.classList.add(c === side ? (c === 'blue' ? 'pullB' : 'pullR') : 'lose');} } document.querySelectorAll('.dust').forEach(x => {x.classList.remove('show'); void x.offsetWidth; x.classList.add('show')}); document.getElementById('ropeBox').classList.add('ropeTug'); bend(side, p); move(); document.getElementById('score').textContent = `${blueScore} : ${redScore}`; document.getElementById('status').textContent = a.ok ? `✅ BENAR! Tim Biru menarik ${p === 1 ? 'sedikit' : p === 2 ? 'sedang' : 'kuat'}!` : `❌ SALAH! Tim Merah menarik ${p === 1 ? 'sedikit' : p === 2 ? 'sedang' : 'kuat'}!`; if (Math.abs(position) >= 8) {setTimeout(() => {alert(side === 'blue' ? '🏆 TIM BIRU MENANG!' : '🏆 TIM MERAH MENANG!'); location.reload()}, 900)} else {n++; setTimeout(() => {document.querySelectorAll('.person').forEach(x => x.className = 'person'); document.getElementById('ropeBox').classList.remove('ropeTug'); show()}, 1000)} }
        function bend(side, p) {let a = (side === 'blue' ? -1 : 1) * (8 + p * 8); let d = `M0 50 C250 ${50 + a} 500 ${50 - a} 750 ${50 + a / 2} C850 ${50 + a / 3} 930 50 1000 50`; for (let id of ['rope', 'ropeShadow', 'ropeLight']) document.getElementById(id).setAttribute('d', d); setTimeout(() => {for (let id of ['rope', 'ropeShadow', 'ropeLight']) document.getElementById(id).setAttribute('d', 'M0 50 C250 50 750 50 1000 50')}, 650)}
        function move() {let x = position * 17; document.getElementById('ropeBox').style.transform = `translateX(${x}px)`; document.getElementById('flag').style.transform = `translateX(calc(-50% + ${x}px))`}
        function toggleSound() {sound = !sound; document.getElementById('snd').textContent = sound ? 'ON' : 'OFF'}
    </script>
</body>

</html>
